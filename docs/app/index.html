    ${hid?`<button class="btn btn-sil btn-tam" style="margin-top:8px" onclick="if(ikiKez(this,'Eski randevular etkilenmez. Tekrar basın'))hizmetSil('${hid}')">Hizmeti sil</button>`:''}`);
}
function hizmetKaydet(hid){
  const f=deger('hFiy'),v={ad:deger('hAd'),adAr:deger('hAdAr'),fiyat:f===''?'':Math.max(0,Number(f)||0)};
  if(!v.ad)return hata('Hizmet adı yazın.');
  if(hid)Object.assign(V.hizmetler.find(x=>x.id===hid),v);else V.hizmetler.push({id:yeniId(),...v});
  kaydet();kapat();ciz();bildir('Hizmet kaydedildi');
}
function hizmetSil(hid){const h=H(hid);V.randevular.forEach(r=>{if(r.hid===hid)r.hizmetAdi=h.ad});V.hizmetler=V.hizmetler.filter(x=>x.id!==hid);kaydet();kapat();ciz()}

/* ---------- telefon bildirimi (Web Push) — sunucu her dakika bakar, telefon kilitliyken de gelir ---------- */
// iPhone: yalnız ana ekrana eklenmiş uygulamada çalışır (iOS 16.4+). Safari sekmesinde PushManager yoktur.
const PUSH_URL=CRM_AYAR.url+'/functions/v1/bildirim-gonder';
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const kurulu=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let PUSH_DURUM='bilinmiyor'; // acik | kapali | engelli | ana-ekran | destek-yok
const BILDIRIM_DK=[[0,'Kapalı'],[15,'15 dakika önce'],[30,'30 dakika önce'],[60,'1 saat önce'],[120,'2 saat önce']];
const SABAH_SAAT=['07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00'];
function bildirimOzetYazi(){
  const dk=Number(AYAR.bildirimDk);
  const r=dk>0?'Randevudan '+(BILDIRIM_DK.find(x=>x[0]===dk)||[0,dk+' dakika önce'])[1].replace(' önce','')+' önce':'Randevu bildirimi kapalı';
  return r+(AYAR.sabahOzet?', sabah '+AYAR.sabahSaat+'\'da günün özeti':'')+'; saatli hatırlatıcılar saatinde.';
}
function b64Bayt(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const r=atob(s+'='.repeat((4-s.length%4)%4));return Uint8Array.from(r,c=>c.charCodeAt(0))}
const cihazAdi=()=>(IOS?'iPhone':/Android/i.test(navigator.userAgent)?'Android':'Bilgisayar')+' · '+(kurulu()?'uygulama':'tarayıcı');
async function pushDurumBul(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))PUSH_DURUM=IOS&&!kurulu()?'ana-ekran':'destek-yok';
  else if(Notification.permission==='denied')PUSH_DURUM='engelli';
  else{try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.getSubscription();PUSH_DURUM=s&&Notification.permission==='granted'?'acik':'kapali'}catch(e){PUSH_DURUM='kapali'}}
  return PUSH_DURUM;
}
async function aboneKaydet(s){
  const j=s.toJSON();
  const{error}=await sb.rpc('bildirim_abone_ol',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_cihaz:cihazAdi()});
  if(error)throw error;
}
// açılışta: bu cihaz zaten açıksa aboneliği bu hesaba/firmaya yeniden bağla
async function pushBasla(){
  if(location.protocol!=='https:')return;
  await pushDurumBul();
  navCiz();
  if(PUSH_DURUM==='acik'){try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.getSubscription();if(s)await aboneKaydet(s)}catch(e){console.error(e)}}
  if(ekran==='bildirimler'&&!document.getElementById('perde').classList.contains('acik'))ciz();
}
async function pushAc(b){
  if(PUSH_DURUM==='ana-ekran')return anaEkranYardim();
  if(PUSH_DURUM==='destek-yok')return bildir('Bu tarayıcı bildirim desteklemiyor');
  if(PUSH_DURUM==='engelli')return git('bildirimler');
  if(b)b.disabled=true;
  try{
    const izin=await Notification.requestPermission(); // iPhone: dokunuşun hemen ardından sorulmalı
    if(izin!=='granted'){await pushDurumBul();ciz();return bildir('Bildirim izni verilmedi')}
    let{data:anahtar}=await sb.rpc('bildirim_acik_anahtar');
    if(!anahtar){await fetch(PUSH_URL,{method:'POST'}).catch(()=>{});({data:anahtar}=await sb.rpc('bildirim_acik_anahtar'))}
    if(!anahtar)throw new Error('Bildirim sunucusu hazır değil, biraz sonra tekrar deneyin.');
    const reg=await navigator.serviceWorker.ready;
    let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64Bayt(anahtar)});
    await aboneKaydet(s);
    PUSH_DURUM='acik';ciz();
    await pushDeneme();
  }catch(e){console.error(e);bildir('Bildirim açılamadı: '+HATA_TR(e.message||String(e)))}
  finally{if(b&&b.isConnected)b.disabled=false}
}
async function pushDeneme(b){
  if(b)b.disabled=true;
  const{error}=await sb.rpc('bildirim_deneme_iste');
  if(error){if(b)b.disabled=false;return bildir('Gönderilemedi: '+HATA_TR(error.message))}
  fetch(PUSH_URL,{method:'POST'}).catch(()=>{});
  bildir('Deneme bildirimi gönderildi, birkaç saniye içinde gelir');
  if(b)setTimeout(()=>{if(b.isConnected)b.disabled=false},4000);
}
async function pushKapat(b){
  if(!ikiKez(b,'Bu cihazda kapatmak için tekrar basın'))return;
  try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.getSubscription();if(s){await sb.rpc('bildirim_abonelik_sil',{p_endpoint:s.endpoint});await s.unsubscribe()}}catch(e){console.error(e)}
  await pushDurumBul();ciz();bildir('Bu cihazda bildirimler kapatıldı');
}
function anaEkranYardim(){
  ac('Bildirimleri açmak için',`
    <p class="not" style="margin-top:14px">iPhone'da bildirim yalnız ana ekrana eklenen uygulamada çalışır (iOS 16.4 ve üstü).</p>
    <div class="kutu" style="margin-top:12px">
      <div class="satir"><span>1</span><b style="text-align:left;flex:1;margin-left:12px">Safari'de alttaki <u>Paylaş</u> simgesine (yukarı oklu kare) dokunun</b></div>
      <div class="satir"><span>2</span><b style="text-align:left;flex:1;margin-left:12px">"<u>Ana Ekrana Ekle</u>"yi seçip "Ekle"ye basın</b></div>
      <div class="satir"><span>3</span><b style="text-align:left;flex:1;margin-left:12px">Ana ekrandaki CRM simgesinden açıp giriş yapın</b></div>
      <div class="satir"><span>4</span><b style="text-align:left;flex:1;margin-left:12px">Menü (☰) → Bildirimler → "Bu telefonda bildirimleri aç"</b></div>
    </div>
    <button class="btn btn-ana btn-tam btn-buyuk" style="margin-top:18px" onclick="kapat()">Tamam</button>`);
}
const ZIL_YOL='<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>';
const ZIL_ACIK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ZIL_YOL}</svg>`;
const ZIL_KAPALI=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ZIL_YOL}<path d="M3 3l18 18"/></svg>`;
// bildirimler tek yerde: kendi sayfası (Ayarlar'da yok)
function ekranBildirimler(){return `<div style="max-width:640px">${bildirimPaneli()}</div>`}
function bildirimPaneli(){
  const d=PUSH_DURUM,dk=Number(AYAR.bildirimDk);
  const etiket={acik:'Bu cihazda açık',kapali:'Bu cihazda kapalı',engelli:'İzin verilmedi','ana-ekran':'Ana ekrana ekleyin','destek-yok':'Desteklenmiyor',bilinmiyor:''}[d];
  const ust=d==='acik'
    ?`<div class="iki" style="margin-top:4px"><button class="btn btn-ikincil" onclick="pushDeneme(this)">${I('zil')}Deneme gönder</button><button class="btn btn-ikincil" onclick="pushKapat(this)">Bu cihazda kapat</button></div>`
    :d==='engelli'
    ?`<div class="uyari" style="margin-top:4px">${I('uyari')}<span>Bu cihazda bildirim izni verilmemiş. ${IOS?'iPhone Ayarlar → Bildirimler → CRM → "Bildirimlere İzin Ver"i açın.':'Tarayıcının site ayarlarından bildirime izin verin.'} Sonra uygulamayı kapatıp açın.</span></div>`
    :`<button class="btn btn-ana btn-tam" style="margin-top:4px" onclick="pushAc(this)">${I('zil')}${IOS?'Bu telefonda':'Bu cihazda'} bildirimleri aç</button>`;
  return `<div class="panel" id="bildirimPanel">
    <div class="panel-ust"><h2>${I('zil')}Bildirimler</h2><span class="sayi">${etiket}</span></div>
    <div class="ayar-ic">
      ${ust}
      <label>Randevu bildirimi</label>
      <select onchange="AYAR.bildirimDk=Number(this.value);kaydet()">${BILDIRIM_DK.map(x=>`<option value="${x[0]}" ${x[0]===dk?'selected':''}>${x[1]}</option>`).join('')}</select>
      <label>Sabah özeti</label>
      <select onchange="if(this.value){AYAR.sabahOzet=true;AYAR.sabahSaat=this.value}else AYAR.sabahOzet=false;kaydet()"><option value="" ${AYAR.sabahOzet?'':'selected'}>Kapalı</option>${SABAH_SAAT.map(s=>`<option value="${s}" ${AYAR.sabahOzet&&AYAR.sabahSaat===s?'selected':''}>Her sabah ${s}</option>`).join('')}</select>
      <p class="ipucu">Sabah özeti o gün randevu varsa gelir ("Bugün 5 randevunuz var"). Saati girilmiş hatırlatıcılar da saatinde bildirim olarak gelir. Bildirim, bu firmada bildirimi açmış tüm cihazlara gider; seçimler kendiliğinden kaydedilir.</p>
    </div>
  </div>`;
}
setInterval(()=>{if(!HAZIR)return;if(tarihStr(new Date())!==BUGUN&&!document.getElementById('perde').classList.contains('acik'))ciz()},60000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){kapat();menuKapat()}});

/* ---------- şifre göster/gizle (göz simgesi) — sonradan açılan pencerelerdeki şifre kutularına da eklenir ---------- */
const GOZ_AC='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const GOZ_KAPA='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/></svg>';
function gozEkle(){
  document.querySelectorAll('input[type=password]:not([data-goz])').forEach(i=>{
    i.dataset.goz='1';
    const s=document.createElement('span');s.className='goz-kap';i.parentNode.insertBefore(s,i);s.appendChild(i);
    const b=document.createElement('button');b.type='button';b.className='goz';b.tabIndex=-1;b.setAttribute('aria-label','Şifreyi göster');b.innerHTML=GOZ_AC;
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.onclick=()=>{const gizli=i.type==='password';i.type=gizli?'text':'password';b.innerHTML=gizli?GOZ_KAPA:GOZ_AC;b.setAttribute('aria-label',gizli?'Şifreyi gizle':'Şifreyi göster')};
    s.appendChild(b);
  });
}
new MutationObserver(gozEkle).observe(document.body,{childList:true,subtree:true});gozEkle();
/* ---------- takvim: parmakla sağa-sola kaydırma (çizelge = gün, üst şerit = hafta) ---------- */
(function(){
  const kok=document.getElementById('icerik');let d=null,sonKaydirma=0;
  const sifirla=el=>{el.style.transition='transform .2s ease,opacity .2s ease';el.style.transform='';el.style.opacity=''};
  kok.addEventListener('touchstart',e=>{
    if(ekran!=='takvim'||e.touches.length!==1)return;
    const el=e.target.closest('.hafta,.zaman');if(!el)return;
    d={x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,yon:null,el,hafta:el.classList.contains('hafta')};
  },{passive:true});
  kok.addEventListener('touchmove',e=>{
    if(!d)return;
    const dx=e.touches[0].clientX-d.x,dy=e.touches[0].clientY-d.y;
    if(!d.yon){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;d.yon=Math.abs(dx)>Math.abs(dy)*1.2?'yatay':'dikey'}
    if(d.yon!=='yatay')return;
    if(e.cancelable)e.preventDefault();
    d.dx=dx;d.el.style.transition='none';d.el.style.transform=`translateX(${dx*.6}px)`;d.el.style.opacity=String(1-Math.min(Math.abs(dx)/600,.4));
  },{passive:false});
  const bitir=()=>{
    if(!d)return;const s=d;d=null;
    if(s.yon!=='yatay')return;
    sonKaydirma=Date.now();
    if(Math.abs(s.dx)<60){sifirla(s.el);return}
    const ileri=s.dx<0;
    seciliGun=gunEkle(seciliGun,(s.hafta?7:1)*(ileri?1:-1));
    ciz();
    const yeni=document.querySelector(s.hafta?'.hafta':'.zaman');
    if(yeni){yeni.style.transition='none';yeni.style.transform=`translateX(${ileri?40:-40}px)`;yeni.style.opacity='.4';requestAnimationFrame(()=>requestAnimationFrame(()=>sifirla(yeni)))}
  };
  kok.addEventListener('touchend',bitir);kok.addEventListener('touchcancel',bitir);
  // kaydırma bitince yanlışlıkla "boş saate randevu ekle" açılmasın
  kok.addEventListener('click',e=>{if(Date.now()-sonKaydirma<400){e.stopPropagation();e.preventDefault()}},true);
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
basla();
</script>
