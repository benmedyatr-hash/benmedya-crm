<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../ayar.js"></script>
<script src="../sektorler.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f7; --kart:#ffffff; --yazi:#1a1a1e; --soluk:#6e6e78; --cok-soluk:#a1a1aa; --cizgi:#e9e9ec; --hover:#fafafb;
  --ana:#9b3d63; --ana-koyu:#7f2f50; --ana-acik:#f7edf1; --ana-yazi:#fff; --vurgu:#9b3d63;
  --yan:#19171c; --yan-yazi:#b9b5bd; --yan-aktif:#2a262e;
  --yesil:#1f7a4d; --yesil-acik:#e7f4ed; --kirmizi:#b9382f; --kirmizi-acik:#fbeceb;
  --mavi:#3f5585; --mavi-acik:#edf0f7; --sari:#8a6100; --sari-acik:#fdf4dc; --wa:#1a8f4e;
  --golge:0 1px 2px rgba(20,20,30,.04),0 1px 8px rgba(20,20,30,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--yazi);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.kilit{overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;font-size:16px;width:100%;height:44px;padding:0 12px;border:1px solid var(--cizgi);border-radius:10px;background:#fff;color:var(--yazi);outline:none;transition:border-color .15s,box-shadow .15s}
@media(min-width:901px){input,select,textarea{font-size:14px;height:42px}}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ana);box-shadow:0 0 0 3px var(--ana-acik)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ana);cursor:pointer;flex:none}
input[type=radio]{width:20px;height:20px;padding:0;margin:0;accent-color:var(--vurgu);cursor:pointer;flex:none}
label{display:block;font-size:12px;font-weight:600;color:var(--soluk);margin:14px 0 6px;letter-spacing:.01em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--vurgu);text-decoration:none}

/* ---------- yerleşim ---------- */
.uyg{display:flex;min-height:100vh}
.yan{width:252px;flex:none;background:var(--yan);color:var(--yan-yazi);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px}
.marka{display:flex;align-items:center;gap:12px;padding:0 8px 26px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:var(--ana);color:var(--ana-yazi);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.marka-yazi{min-width:0}
.marka-yazi b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marka-yazi small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.22em;margin-top:3px}
.yan .marka-yazi b{color:#fff;max-width:162px}
.yan .marka-yazi small{color:#8a8590}
.yan nav button{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:9px;color:var(--yan-yazi);font-weight:500;margin-bottom:2px;position:relative}
.yan nav button:hover{background:#221f26;color:#fff}
.yan nav button.aktif{background:var(--yan-aktif);color:#fff}
.zil-durum{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.zil-durum svg{width:15px;height:15px}
.zil-durum.acik{background:rgba(46,180,100,.2);color:#46d17f}
.zil-durum.kapali{background:rgba(225,70,60,.2);color:#ff6f62}
.yan nav .ayrac{height:1px;background:rgba(255,255,255,.24);margin:10px 6px}
.yan nav button.aktif::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ana)}
.yan nav .rozet{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ana);color:var(--ana-yazi);font-size:11px;font-weight:700;display:grid;place-items:center}
.yan .yan-alt{margin-top:auto}
.yan .surum{font-size:11.5px;color:#7a7580;padding:12px;border:1px solid #2c2830;border-radius:10px;line-height:1.5;margin-top:10px}
.yan .surum b{color:#d8d3db;display:block;margin-bottom:2px}

.govde{flex:1;min-width:0}
.ust{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 32px;background:var(--kart);border-bottom:1px solid var(--cizgi);position:sticky;top:0;z-index:5}
.ust h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.ust .tarih{font-size:13px;color:var(--soluk);margin-top:2px}
.ust .marka{display:none}
.ust .ayar-btn{display:none}
.marka-dugme{background:none;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.ust-sol{display:contents}
.menu-btn{display:none}
.crm-etiket,.dikey-cizgi{display:none}
.ust-sag{display:flex;align-items:center;gap:8px;flex:none}
.cikis-ust{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--cizgi);background:var(--kart);color:var(--kirmizi);font-weight:600;font-size:13.5px;transition:background .15s}
.cikis-ust:hover{background:var(--kirmizi-acik)}
.cikis-ust.onay{background:var(--kirmizi);border-color:var(--kirmizi);color:#fff}
main{padding:26px 32px 60px;max-width:1200px}
.sayfa-baslik{display:none}

/* ---------- düğmeler ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,opacity .15s}
.btn svg.i{width:17px;height:17px}
.btn-ana{background:var(--ana);color:var(--ana-yazi)}.btn-ana:hover{background:var(--ana-koyu)}
.btn-ikincil{background:var(--kart);border:1px solid var(--cizgi);color:var(--yazi)}.btn-ikincil:hover{background:var(--hover)}
.btn-ince{background:var(--ana-acik);color:var(--vurgu)}
.btn-wa{background:var(--wa);color:#fff}
.btn-geldi{background:var(--yesil-acik);color:var(--yesil)}
.btn-gelmedi,.btn-sil{background:var(--kirmizi-acik);color:var(--kirmizi)}
.btn:disabled{opacity:.35;cursor:default}
.btn-tam{width:100%}
.btn-buyuk{height:48px;font-size:15px}

/* ---------- panel ---------- */
.panel{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;box-shadow:var(--golge);overflow:hidden}
.panel-ust{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--cizgi);height:58px}
.panel-ust h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;white-space:nowrap}
.panel-ust h2 svg{color:var(--vurgu)}
.panel-ust .sayi{font-size:12.5px;color:var(--soluk);white-space:nowrap}
.panel-ic{padding:4px 18px}
.bos{text-align:center;color:var(--cok-soluk);padding:34px 10px;font-size:13.5px}
.not{font-size:12.5px;color:var(--soluk);line-height:1.6}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi .panel{padding:16px 18px;height:106px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.kpi .panel:hover{border-color:#dcdce0}
.kpi .etk{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--soluk);font-weight:500}
.kpi .etk span{width:32px;height:32px;border-radius:9px;background:var(--ana-acik);color:var(--vurgu);display:grid;place-items:center}
.kpi .etk span svg{width:16px;height:16px}
.kpi b{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}

.izgara{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:start}
.sutun{display:flex;flex-direction:column;gap:20px}

.avatar{width:38px;height:38px;border-radius:50%;background:var(--ana-acik);color:var(--vurgu);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.avatar.buyuk{width:56px;height:56px;font-size:19px}

/* randevu satırı */
.rnd{display:grid;grid-template-columns:4px 64px minmax(0,1fr) auto;gap:0 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--cizgi)}
.rnd:last-child{border-bottom:0}
.rnd .serit{align-self:stretch;border-radius:4px;background:var(--ana)}
.rnd.geldi .serit{background:var(--yesil)}.rnd.gelmedi .serit{background:var(--kirmizi)}
.rnd .saat{font-weight:700;font-size:15px}
.rnd .saat small{display:block;font-weight:500;font-size:12px;color:var(--cok-soluk);margin-top:1px}
.rnd .kim{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.rnd .kim>div:last-child{min-width:0}
.ad{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt-yazi{font-size:12.5px;color:var(--soluk);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etiketler{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.rnd .islem{display:grid;grid-template-columns:40px 94px 94px;gap:6px}
.rnd .islem .btn{height:36px;padding:0 10px;font-size:12.5px}
.etiket{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.e-paket{background:var(--ana-acik);color:var(--vurgu)}
.e-geldi,.e-odendi{background:var(--yesil-acik);color:var(--yesil)}
.e-gelmedi,.e-uyari{background:var(--kirmizi-acik);color:var(--kirmizi)}
.e-bekliyor{background:#f1f1f3;color:var(--soluk)}
.e-kapora{background:var(--mavi-acik);color:var(--mavi)}
.e-borc{background:var(--sari-acik);color:var(--sari)}

/* kısa satır */
.kisa{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--cizgi);min-height:64px}
.kisa:last-child{border-bottom:0}
.kisa .orta{flex:1;min-width:0;cursor:pointer}
.kisa .btn{height:34px;width:106px;padding:0;font-size:12.5px;flex:none}

/* hatırlatıcı */
.gorev{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--cizgi);min-height:62px}
.gorev:last-child{border-bottom:0}
.gorev .orta{flex:1;min-width:0;cursor:pointer}
.gorev.bitti .ad{text-decoration:line-through;color:var(--cok-soluk)}
.gorev .zaman-etk{font-size:12px;font-weight:600;color:var(--soluk);white-space:nowrap;flex:none;text-align:right;width:92px}
.gorev .zaman-etk.gec{color:var(--kirmizi)}
.grup-baslik{font-size:11.5px;font-weight:600;color:var(--cok-soluk);text-transform:uppercase;letter-spacing:.06em;padding:16px 0 4px}

/* takvim */
.hafta{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr)) 40px;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--cizgi)}
.gun{height:64px;border-radius:11px;border:1px solid var(--cizgi);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--kart);min-width:0}
.gun:hover{border-color:#d6d6db}
.gun small{font-size:11.5px;color:var(--soluk);font-weight:500}
.gun b{font-size:18px;font-weight:700;margin-top:1px}
.gun i{height:5px;width:5px;border-radius:50%;margin-top:4px;background:transparent}
.gun.dolu i{background:var(--ana)}
.gun.bugun b{color:var(--vurgu)}
.gun.secili{background:var(--ana);border-color:var(--ana)}
.gun.secili small,.gun.secili b{color:var(--ana-yazi)}.gun.secili i{background:var(--ana-yazi)}
.ok{height:40px;width:40px;border-radius:9px;display:grid;place-items:center;color:var(--soluk)}
.ok:hover{background:#f3f3f5}
.gun-bilgi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 6px}
.gun-bilgi b{font-size:14px}
.toplu{border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;margin-top:10px;transition:box-shadow .2s,border-color .2s,opacity .2s}
.toplu.sirada{border-color:var(--ana);box-shadow:0 0 0 2px var(--ana-acik)}
.toplu.gitti{opacity:.6}
.toplu-ust{display:flex;align-items:center;gap:10px}
.toplu-ust .orta{flex:1;min-width:0}
.toplu-dil{display:flex;gap:2px;flex:none;border:1px solid var(--cizgi);border-radius:8px;padding:2px}
.toplu-dil button{min-width:30px;height:28px;border-radius:6px;font-size:12px;font-weight:700;color:var(--soluk)}
.toplu-dil button.secili{background:var(--ana-acik);color:var(--vurgu)}
.toplu textarea{margin-top:8px;min-height:76px;font-size:13px}
.zaman{position:relative;margin:10px 18px 18px 74px}
.saatsatir{height:60px;border-top:1px solid var(--cizgi);position:relative;cursor:pointer}
.saatsatir::after{content:"";position:absolute;left:0;right:0;top:30px;border-top:1px dashed #f1f1f3}
.saatsatir:hover{background:var(--hover)}
.saatsatir span{position:absolute;left:-60px;top:-8px;font-size:11.5px;color:var(--cok-soluk);width:48px;text-align:right}
.blok{position:absolute;border-radius:9px;background:var(--ana-acik);border-left:3px solid var(--ana);padding:5px 9px;overflow:hidden;cursor:pointer;font-size:12px;z-index:1;transition:box-shadow .15s}
.blok:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.blok b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blok span{color:var(--soluk);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blok.geldi{background:var(--yesil-acik);border-color:var(--yesil)}
.blok.gelmedi{background:var(--kirmizi-acik);border-color:var(--kirmizi);opacity:.7}
.simdi{position:absolute;left:0;right:0;height:2px;background:var(--kirmizi);z-index:2;pointer-events:none}
.simdi::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--kirmizi)}

/* listeler */
.arac{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid var(--cizgi)}
.aramakutu{position:relative;flex:1;min-width:0}
.aramakutu svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--cok-soluk)}
.aramakutu input{padding-left:38px}
.tablo-bas,.mus{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,1fr) 120px;gap:14px;align-items:center;padding:0 18px}
.tablo-bas{height:40px;font-size:11.5px;font-weight:600;color:var(--cok-soluk);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--cizgi);background:#fcfcfd}
.mus{min-height:66px;border-bottom:1px solid var(--cizgi);cursor:pointer}
.mus:last-child{border-bottom:0}
.mus:hover,.hiz-satir:hover{background:var(--hover)}
.mus .kim{display:flex;align-items:center;gap:12px;min-width:0}
.mus .kim>div:last-child{min-width:0}
.soluk{color:var(--soluk);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hiz-satir,.hiz-bas{display:grid;grid-template-columns:minmax(0,1fr) 130px 72px 40px;gap:14px;align-items:center;padding:0 18px}
.hiz-satir{min-height:58px;border-bottom:1px solid var(--cizgi);cursor:pointer}
.hiz-satir:last-child{border-bottom:0}
.sira-btn{display:flex;gap:4px}
.sira-btn button{width:32px;height:32px;border-radius:8px;border:1px solid var(--cizgi);background:var(--kart);display:grid;place-items:center;font-size:15px;color:var(--soluk)}
.sira-btn button:disabled{opacity:.3;cursor:default}
.sira-btn button:not(:disabled):hover{color:var(--vurgu);border-color:var(--vurgu)}

/* ayarlar */
.ayar-izgara{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.ayar-ic{padding:4px 18px 18px}
.renkler{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.renk{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--cizgi)}
.renk.secili{box-shadow:0 0 0 2px var(--yazi)}
.liste-btn{display:flex;align-items:center;gap:12px;width:100%;height:54px;padding:0 18px;border-bottom:1px solid var(--cizgi);text-align:left;font-weight:500}
.liste-btn:last-child{border-bottom:0}
.liste-btn:hover{background:var(--hover)}
.liste-btn svg:first-child{color:var(--vurgu)}
.liste-btn .sag{margin-left:auto;color:var(--cok-soluk)}
.ipucu{font-size:12px;color:var(--cok-soluk);margin-top:6px;line-height:1.5}
.ipucu code{background:#f1f1f3;color:var(--yazi);padding:1px 5px;border-radius:5px;font-size:11.5px}

/* pencere */
.perde{position:fixed;inset:0;background:rgba(20,16,22,.45);display:none;z-index:30;align-items:center;justify-content:center;padding:20px}
.perde.acik{display:flex}
.pencere{background:var(--kart);width:100%;max-width:540px;max-height:90vh;overflow:auto;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);overscroll-behavior:contain}
.pencere-ust{display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:60px;border-bottom:1px solid var(--cizgi);position:sticky;top:0;background:var(--kart);z-index:2}
.pencere-ust h3{font-size:16px;font-weight:600}
.pencere-ic{padding:6px 22px 24px}
.kapat{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--soluk)}
.kapat:hover{background:#f3f3f5}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.satir{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--cizgi);font-size:13.5px;gap:14px;min-height:44px}
.satir:last-child{border-bottom:0}
.satir>span:first-child{color:var(--soluk);flex:none}
.satir>b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.profil{display:flex;align-items:center;gap:14px;padding:18px 0 4px}
.profil>div:last-child{min-width:0}
.profil b{font-size:17px;display:block}
.profil small{color:var(--soluk);font-size:13px}
.bolum{font-size:11.5px;font-weight:600;color:var(--cok-soluk);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center;min-height:30px}
.kutu{border:1px solid var(--cizgi);border-radius:12px;padding:2px 14px}
.paket{border:1px solid var(--cizgi);border-radius:12px;padding:14px;margin-bottom:8px}
.hsec{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hsec-para{grid-column:1/-1;display:none;grid-template-columns:minmax(0,1fr) auto;grid-template-columns:subgrid;gap:6px 8px;align-items:end;padding-top:2px}
.hsec-sag{grid-column:auto!important;height:36px;margin:0!important;white-space:nowrap}
.hsec-al{grid-column:auto!important;height:36px;margin:0!important;white-space:nowrap;padding:0 4px}
.hsec .hsec-satir{border:1px solid var(--cizgi);border-radius:12px}
.hsec .hsec-satir.secili{border-color:color-mix(in srgb,var(--ana) 35%,var(--cizgi))}
.hsec-satir.secili .hsec-para{display:grid}
.hsec-para label{margin:0 0 4px;font-size:11px}
.hsec-tik{grid-column:1/-1;display:flex!important;align-items:center;gap:8px;margin:2px 0 0!important;font-size:12.5px!important;font-weight:500!important;color:var(--yazi)!important;cursor:pointer}
.paket-para{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--soluk);margin:8px 0 6px}
.paket-para b{color:var(--yazi)}
.hsec-satir{display:grid;grid-template-columns:minmax(0,1fr) minmax(92px,auto);gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--cizgi)}
.hsec-satir:first-child{border-top:0}
.hsec-satir.secili{background:var(--ana-acik)}
.hsec-ad{display:flex;align-items:center;gap:10px;margin:0;font-size:13.5px;font-weight:500;color:var(--yazi);cursor:pointer;min-width:0}
.hsec-ad span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsec-satir select,.hsec-satir input[type=number]{height:36px;padding:0 8px;font-size:13px;margin:0;min-width:0}
.hsec-satir:not(.secili) select,.hsec-satir:not(.secili) .hsec-ode{opacity:.45}
.ilerleme{height:7px;background:#efeff1;border-radius:7px;overflow:hidden;margin:10px 0 8px}
.ilerleme div{height:100%;background:var(--ana);border-radius:7px}
.uyari{display:flex;gap:8px;align-items:flex-start;background:var(--kirmizi-acik);color:var(--kirmizi);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;font-weight:500}
.bilgi{background:var(--ana-acik);color:var(--vurgu);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;font-weight:500}
.alt-dugmeler{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.secim{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--cizgi);border-radius:12px;margin-top:10px;text-align:left}
.secim:hover{background:var(--hover);border-color:#dcdce0}
.secim .avatar{border-radius:12px;width:44px;height:44px}
.secim b{display:block;font-size:14.5px}
.secim small{color:var(--soluk);font-size:12.5px}
.kucuk-sayi{width:32px;height:32px;padding:0}

.mobil-nav{display:none}
.kpi .panel.secili{border-color:var(--ana);box-shadow:0 0 0 2px var(--ana-acik)}
.panel.vurgu{animation:vurgu 1.4s ease}
@keyframes vurgu{0%,40%{box-shadow:0 0 0 3px var(--ana)}100%{box-shadow:var(--golge)}}
.yan-perde{display:none}
.yan nav button.cikis-btn{color:#e08a83}.yan nav button.cikis-btn:hover{background:#2a1f1f;color:#f3a29b}
.hafta,.zaman{touch-action:pan-y}
.kaydir-ipucu{display:none}

/* giriş ekranı */
.giris{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.giris.gizli{display:none}
.giris-kutu{width:100%;max-width:400px;background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;box-shadow:0 10px 40px rgba(20,20,30,.08);padding:34px 28px 28px}
.giris-kutu .logo{width:52px;height:52px;font-size:22px;border-radius:14px;margin-bottom:18px;background:var(--yan)}
.giris-kutu h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.giris-kutu p.alt{color:var(--soluk);font-size:13.5px;margin-top:4px}
.giris-kutu .link{display:block;margin:14px auto 0;color:var(--soluk);font-size:13px;text-decoration:underline}
.yukleniyor{position:fixed;inset:0;z-index:49;background:var(--bg);display:grid;place-items:center;color:var(--soluk);font-size:14px}
.yukleniyor.gizli{display:none}
.donen{width:28px;height:28px;border:3px solid var(--cizgi);border-top-color:var(--ana);border-radius:50%;animation:don .8s linear infinite;margin:0 auto 12px}
@keyframes don{to{transform:rotate(360deg)}}
/* kayıt durumu */
.senk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--soluk);white-space:nowrap}
.senk i{width:8px;height:8px;border-radius:50%;background:var(--yesil)}
.senk.bekliyor i{background:#d4a017}
.senk.hata{color:var(--kirmizi)}.senk.hata i{background:var(--kirmizi)}
.yan .hesap{font-size:12px;color:#8a8590;padding:12px;border:1px solid #2c2830;border-radius:10px;margin-top:10px;line-height:1.5}
.yan .hesap b{display:block;color:#d8d3db;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yan .hesap .senk{color:#8a8590;margin-top:6px}

.goz-kap{position:relative;display:block}
.goz-kap input{padding-right:48px}
.goz{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:40px;height:38px;display:grid;place-items:center;color:#a1a1aa;border-radius:8px;background:none;border:0;cursor:pointer}
.goz:hover{color:#1a1a1e}
/* ---------- telefon ---------- */
@media(max-width:900px){

const I=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
function tarihStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function gunEkle(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return tarihStr(d)}
function guzelTarih(s){const d=new Date(s+'T12:00');return d.getDate()+' '+AYLAR[d.getMonth()]+' '+d.getFullYear()+', '+GUNLER[d.getDay()]}
function kisaTarih(s){const d=new Date(s+'T12:00');return d.getDate()+' '+AYLAR[d.getMonth()]+' '+d.getFullYear()}
function gunAy(s){const d=new Date(s+'T12:00');return d.getDate()+' '+AYLAR[d.getMonth()]}
function goreceli(s){if(s===BUGUN)return 'Bugün';if(s===gunEkle(BUGUN,1))return 'Yarın';if(s===gunEkle(BUGUN,-1))return 'Dün';return gunAy(s)}
function yeniId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
// telefon: 0542 504 2256 (başta 0 yoksa eklenir; +90 → 0; yurt dışı numaralar olduğu gibi)
function telBicim(v){v=String(v||'').trim();if(!v)return '';if(/^(\+|00)/.test(v)&&!/^(\+|00)\s*90/.test(v))return v;let d=v.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('90')&&d.length>10)d=d.slice(2);if(d&&d[0]!=='0')d='0'+d;d=d.slice(0,11);return [d.slice(0,4),d.slice(4,7),d.slice(7,11)].filter(Boolean).join(' ')}
function k(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tl(n){return Number(n||0).toLocaleString('tr-TR')+' ₺'}
const dakika=s=>String(s||'0:0').split(':').reduce((a,b)=>a*60+ +b,0);
function saatStr(t){t=((t%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const bitis=(s,dk)=>saatStr(dakika(s)+Number(dk||0));
function basHarf(ad){return String(ad||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toLocaleUpperCase('tr')||'?'}
const ilkAd=ad=>String(ad||'').trim().split(/\s+/)[0]||'';

/* ---------- veri: Supabase (her firma yalnız kendi kaydını görür) ---------- */
// lock: sekmeler arası kilit kapalı — uygulama penceresi + açık sekme birlikteyken açılışta takılmayı önler
const sb=supabase.createClient(CRM_AYAR.url,CRM_AYAR.anahtar,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,lock:(ad,sure,fn)=>fn()}});
const TURLER={musteri:'musteriler',hizmet:'hizmetler',randevu:'randevular',paket:'paketler',gorev:'gorevler',satis:'satislar'};
let V={hizmetler:[],musteriler:[],paketler:[],randevular:[],gorevler:[],satislar:[]}, AYAR={...VARSAYILAN_AYAR};
let FIRMA=null, KULLANICI=null, SNAP=new Map(), AYAR_SNAP='', HAZIR=false, kanal=null;
let kayitZaman=null, kaydediliyor=false, tekrarKaydet=false, bekleyenCiz=false;

function ayarVeri(){const a={...AYAR};delete a.firma;return a}
function anlik(){const m=new Map();for(const[t,ad]of Object.entries(TURLER))for(const x of V[ad])m.set(t+'|'+x.id,JSON.stringify(x));return m}

function kaydet(){if(!HAZIR)return;clearTimeout(kayitZaman);senkDurum('bekliyor');kayitZaman=setTimeout(senkron,300)}
async function senkron(){
  kayitZaman=null;
  if(kaydediliyor){tekrarKaydet=true;return}
  kaydediliyor=true;
  try{
    const simdi=anlik(),yaz=[],sil={},zaman=new Date().toISOString();
    simdi.forEach((j,a)=>{if(SNAP.get(a)!==j){const[t,id]=a.split('|');yaz.push({firma_id:FIRMA.id,tur:t,id,veri:JSON.parse(j),guncellendi:zaman})}});
    SNAP.forEach((j,a)=>{if(!simdi.has(a)){const[t,id]=a.split('|');(sil[t]=sil[t]||[]).push(id)}});
    for(let i=0;i<yaz.length;i+=500){const{error}=await sb.from('kayitlar').upsert(yaz.slice(i,i+500));if(error)throw error}
    for(const t in sil){const{error}=await sb.from('kayitlar').delete().eq('firma_id',FIRMA.id).eq('tur',t).in('id',sil[t]);if(error)throw error}
    const aj=JSON.stringify(ayarVeri());
    if(aj!==AYAR_SNAP||AYAR.firma!==FIRMA.ad){const{error}=await sb.from('firmalar').update({ad:AYAR.firma,ayar:JSON.parse(aj)}).eq('id',FIRMA.id);if(error)throw error;AYAR_SNAP=aj;FIRMA.ad=AYAR.firma}
    SNAP=simdi;senkDurum(tekrarKaydet?'bekliyor':'tamam');
  }catch(e){
    console.error(e);senkDurum('hata');
    if(/JWT|token|401|403/i.test(String(e.message||e.code))){const{data}=await sb.auth.getSession();if(!data.session){kaydediliyor=false;return girisGoster('Oturum sona erdi, lütfen tekrar giriş yapın. Kaydedilmemiş değişiklikler giriş sonrası gönderilir.')}}
    setTimeout(kaydet,5000);
  }finally{kaydediliyor=false;if(tekrarKaydet){tekrarKaydet=false;kaydet()}}
}
function senkDurum(d){
  const yazi={tamam:'Kaydedildi',bekliyor:'Kaydediliyor…',hata:'Bağlantı yok, tekrar denenecek'}[d];
  document.querySelectorAll('.senk').forEach(e=>{e.className='senk '+(d==='tamam'?'':d);e.querySelector('span').textContent=yazi});
}
window.addEventListener('beforeunload',e=>{if(kayitZaman||kaydediliyor){e.preventDefault();e.returnValue=''}});

/* ---------- giriş ---------- */
function girisGoster(mesaj,cikisYap){
  HAZIR=false;
  document.getElementById('yukleniyor').classList.add('gizli');
  document.getElementById('giris').classList.remove('gizli');
  document.getElementById('girisMesaj').innerHTML=mesaj?`<div class="uyari">${I('uyari')}<span>${k(mesaj)}</span></div>`:'';
  document.getElementById('girisBtn').disabled=false;document.getElementById('girisBtn').textContent='Giriş yap';
  if(cikisYap)sb.auth.signOut();
}
const HATA_TR=m=>/Invalid login/i.test(m)?'E-posta ya da şifre hatalı.':/Email not confirmed/i.test(m)?'Hesap henüz onaylanmamış.':/rate limit|too many/i.test(m)?'Çok fazla deneme yapıldı, birkaç dakika sonra tekrar deneyin.':/fetch|network/i.test(m)?'İnternet bağlantısı yok.':m;
async function girisYap(e){
  e.preventDefault();
  const b=document.getElementById('girisBtn');b.disabled=true;b.textContent='Giriş yapılıyor…';
  const{error}=await sb.auth.signInWithPassword({email:document.getElementById('gEposta').value.trim(),password:document.getElementById('gSifre').value});
  if(error)return girisGoster(HATA_TR(error.message));
  document.getElementById('gSifre').value='';
  basla();
}
async function sifremiUnuttum(){
  const ep=document.getElementById('gEposta').value.trim();
  if(!ep)return girisGoster('Önce e-posta adresinizi yazın, sonra "Şifremi unuttum"a basın.');
  const{error}=await sb.auth.resetPasswordForEmail(ep,{redirectTo:location.origin+location.pathname});
  document.getElementById('girisMesaj').innerHTML=error?`<div class="uyari">${I('uyari')}<span>${k(HATA_TR(error.message))}</span></div>`:`<div class="bilgi">Şifre yenileme bağlantısı ${k(ep)} adresine gönderildi. Gelen kutunuzu (ve gereksiz klasörünü) kontrol edin.</div>`;
}

function cikisDokun(b){

  b.classList.add('onay');b.querySelector('span').textContent='Çıkmak için tekrar dokunun';if(innerWidth<901)b.querySelector('span').textContent='Tekrar dokunun';
  clearTimeout(b._z);b._z=setTimeout(()=>{b.classList.remove('onay');b.querySelector('span').textContent='Çıkış'},3000);

async function cikis(){
  if(kayitZaman||kaydediliyor){bildir('Değişiklikler kaydediliyor, birkaç saniye bekleyin');return}
  if(kanal)sb.removeChannel(kanal);
  await sb.auth.signOut();location.reload();
}
function sifreDegistir(){
  ac('Şifre değiştir',`<label>Yeni şifre</label><input id="ySifre" type="password" autocomplete="new-password" minlength="8">
    <label>Yeni şifre (tekrar)</label><input id="ySifre2" type="password" autocomplete="new-password">
    <p class="ipucu">En az 8 karakter.</p>
    <button class="btn btn-ana btn-tam btn-buyuk" style="margin-top:18px" onclick="sifreKaydet()">Şifreyi kaydet</button>`);
}
async function sifreKaydet(){
  const s=document.getElementById('ySifre').value;
  if(s.length<8)return hata('Şifre en az 8 karakter olmalı.');
  if(s!==document.getElementById('ySifre2').value)return hata('İki şifre aynı değil.');
  const{error}=await sb.auth.updateUser({password:s});
  if(error)return hata(HATA_TR(error.message));
  kapat();bildir('Şifre değiştirildi');
  if(!HAZIR)basla();
}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){document.getElementById('giris').classList.add('gizli');document.getElementById('yukleniyor').classList.add('gizli');sifreDegistir()}});

/* ---------- açılış: firmayı ve kayıtları yükle ---------- */
let baslaSayac=null;
async function basla(){
  document.getElementById('giris').classList.add('gizli');
  document.getElementById('yukleniyor').classList.remove('gizli');
  clearTimeout(baslaSayac);
  baslaSayac=setTimeout(()=>{if(!HAZIR&&!document.getElementById('yukleniyor').classList.contains('gizli'))girisGoster('Bağlantı çok yavaş ya da kesildi. İnternetinizi kontrol edip tekrar giriş yapın.')},15000);
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session)return girisGoster();
    KULLANICI=session.user;
    const{data:uye,error:e1}=await sb.from('uyeler').select('firma_id').eq('user_id',KULLANICI.id).maybeSingle();
    if(e1)throw e1;
    if(!uye)return girisGoster('Bu hesap henüz bir firmaya bağlanmamış.',true);
    const{data:f,error:e2}=await sb.from('firmalar').select('id,ad,ayar').eq('id',uye.firma_id).maybeSingle();
    if(e2)throw e2;
    if(!f)return girisGoster('Firma hesabı şu an kullanıma kapalı. Lütfen hizmet aldığınız kişiyle görüşün.',true);
    FIRMA=f;
    const yeni={hizmetler:[],musteriler:[],paketler:[],randevular:[],gorevler:[],satislar:[]};
    for(let bas=0;;bas+=1000){
      const{data,error}=await sb.from('kayitlar').select('tur,veri').eq('firma_id',f.id).order('tur').order('id').range(bas,bas+999);
      if(error)throw error;
      data.forEach(r=>{const l=TURLER[r.tur];if(l)yeni[l].push(r.veri)});
      if(data.length<1000)break;
    }
    V=yeni;hizmetSirala();
    AYAR={...VARSAYILAN_AYAR,...(f.ayar||{}),firma:f.ad};
    SNAP=anlik();AYAR_SNAP=JSON.stringify(ayarVeri());
    HAZIR=true;
    sb.rpc('giris_kaydet').then(()=>{},()=>{});
    // ilk açılış: sektörün hazır hizmetlerini ekle
    // eski kayıtlı telefonlar tek seferlik yeni biçime (0542 504 2256)
    {let deg=0;V.musteriler.forEach(m=>{const f=telBicim(m.tel);if(m.tel&&f!==m.tel){m.tel=f;deg++}});if(deg)setTimeout(kaydet,0)}
    if(!AYAR.kuruldu){if(!V.hizmetler.length)SK().hizmetler.forEach(x=>V.hizmetler.push({id:yeniId(),ad:x[0],sure:x[1],fiyat:x[2]}));AYAR.kuruldu=true;kaydet()}
    document.getElementById('hesapEposta').textContent=KULLANICI.email;
    temaUygula();ciz();
    document.getElementById('yukleniyor').classList.add('gizli');
    canliBaglan();pushBasla();clearTimeout(baslaSayac);
  }catch(e){console.error(e);clearTimeout(baslaSayac);girisGoster('Bağlantı kurulamadı: '+HATA_TR(e.message||String(e)))}
}

/* ---------- canlı: başka cihazdaki değişiklik anında gelir ---------- */
function canliBaglan(){
  if(kanal)sb.removeChannel(kanal);
  kanal=sb.channel('kayit-'+FIRMA.id).on('postgres_changes',{event:'*',schema:'public',table:'kayitlar',filter:'firma_id=eq.'+FIRMA.id},p=>{
    const r=p.new&&p.new.tur?p.new:p.old;if(!r||!TURLER[r.tur])return;
    const l=TURLER[r.tur],a=r.tur+'|'+r.id;
    if(p.eventType==='DELETE'){if(!SNAP.has(a))return;V[l]=V[l].filter(x=>x.id!==r.id);SNAP.delete(a)}
    else{const j=JSON.stringify(p.new.veri);if(SNAP.get(a)===j)return;const i=V[l].findIndex(x=>x.id===r.id);if(i>=0)V[l][i]=p.new.veri;else V[l].push(p.new.veri);SNAP.set(a,j)}
    yenidenCiz();
  }).subscribe();
}
function yenidenCiz(){if(document.getElementById('perde').classList.contains('acik')){bekleyenCiz=true;return}const y=window.scrollY;ciz();window.scrollTo(0,y)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&HAZIR&&!kayitZaman&&!kaydediliyor)tazele()});
async function tazele(){
  // telefon uykudan dönünce kaçırılan değişiklikleri al
  try{
    const yeni={hizmetler:[],musteriler:[],paketler:[],randevular:[],gorevler:[],satislar:[]};
    for(let bas=0;;bas+=1000){const{data,error}=await sb.from('kayitlar').select('tur,veri').eq('firma_id',FIRMA.id).order('tur').order('id').range(bas,bas+999);if(error)return;data.forEach(r=>{const l=TURLER[r.tur];if(l)yeni[l].push(r.veri)});if(data.length<1000)break}
    if(kayitZaman||kaydediliyor)return;
    V=yeni;hizmetSirala();SNAP=anlik();yenidenCiz();
  }catch(e){}
}

const SK=()=>SEKTORLER[AYAR.sektor]||SEKTORLER.genel;
const M=i=>V.musteriler.find(x=>x.id===i)||{ad:'(silinmiş kayıt)',tel:''};
const H=i=>V.hizmetler.find(x=>x.id===i)||{ad:'(silinmiş hizmet)',sure:0,fiyat:0};
const R=i=>V.randevular.find(x=>x.id===i);
const gununRandevulari=t=>V.randevular.filter(r=>r.tarih===t).sort((a,b)=>a.saat.localeCompare(b.saat));
const acikPaket=(mid,hid)=>V.paketler.find(p=>p.mid===mid&&p.hid===hid&&p.kullanilan<p.toplam);
const borc=r=>{if(r.durum!=='geldi'||r.odendi||r.paketli)return 0;const k=Number(r.ucret||0)-Number(r.kapora||0)-Number(r.alinan||0);return k>0?k:0};
const satisBorc=x=>x.odendi?0:Number(x.tutar||0);
const S_=i=>V.satislar.find(x=>x.id===i);
const satisAd=x=>x.mid?M(x.mid).ad:'Kayıtsız müşteri';
// müşteriye eklenen hizmet (paket): bedel (tutar) + ödemeler; eski kayıtlarda tek "odenen" alanı vardı
const paketOdemeleri=p=>p.odemeler||(Number(p.odenen)>0?[{id:'eski',tutar:Number(p.odenen),tarih:p.tarih||'',not:'Ödeme'}]:[]);
const paketOdenen=p=>paketOdemeleri(p).reduce((s,x)=>s+Number(x.tutar||0),0);
const paketBorc=p=>Number(p.tutar)>0?Math.max(0,Number(p.tutar)-paketOdenen(p)):0;
const musteriBorc=mid=>V.randevular.filter(r=>r.mid===mid).reduce((s,r)=>s+borc(r),0)+V.satislar.filter(x=>x.mid===mid).reduce((s,x)=>s+satisBorc(x),0)+V.paketler.filter(p=>p.mid===mid).reduce((s,p)=>s+paketBorc(p),0);
const toplamBorcHesap=()=>V.randevular.reduce((s,r)=>s+borc(r),0)+V.satislar.reduce((s,x)=>s+satisBorc(x),0)+V.paketler.reduce((s,p)=>s+paketBorc(p),0);
const acikGorevler=()=>V.gorevler.filter(g=>!g.bitti&&g.tarih<=BUGUN);

  const c=RENKLER[AYAR.renk]||RENKLER[0],st=document.documentElement.style;
  st.setProperty('--ana',c.ana);st.setProperty('--ana-koyu',c.koyu);st.setProperty('--ana-acik',c.acik);st.setProperty('--ana-yazi',c.yazi||'#fff');st.setProperty('--vurgu',c.vurgu||c.ana);
  document.querySelectorAll('.firmaAd').forEach(e=>e.textContent=AYAR.firma||'Firma Adı');
  document.querySelectorAll('.firmaHarf').forEach(e=>e.textContent=(AYAR.firma||'F').trim()[0].toLocaleUpperCase('tr'));
  document.title=(AYAR.firma||'Firma Adı')+' · CRM';
  crmSigdir();
}

/* ---------- gezinme ---------- */
const EKRANLAR={bugun:['Genel Bakış','ev'],takvim:['Takvim','takvim'],musteriler:['Müşteriler','kisiler'],randevulu:['Randevulu Müşteriler','takvim'],randevusuz:['Randevusuz Müşteriler','saat'],bildirimler:['Bildirimler','zil'],tahsilat:['Tahsilat','tahsilat'],gorevler:['Hatırlatıcılar','gorev'],hizmetler:['Hizmetler & Fiyatlar','hizmet'],ayarlar:['Ayarlar','ayar']};
let ekran='bugun',seciliGun=BUGUN,aramaMetni='';
function navCiz(){
  const n=acikGorevler().length,rs=randevusuzlar().seansli.length;
  const y=s=>`<button class="${s===ekran?'aktif':''}" onclick="git('${s}')">${I(EKRANLAR[s][1])}${EKRANLAR[s][0]}${s==='gorevler'&&n?`<span class="rozet">${n}</span>`:''}${s==='randevusuz'&&rs?`<span class="rozet">${rs}</span>`:''}</button>`;

const DIL_AD={tr:'Türkçe',ar:'العربية'};
const MDIL=m=>m&&m.dil==='ar'?'ar':'tr';
// hizmetin Arapça adı: firmanın yazdığı > hazır sözlük > (yoksa) Türkçe ad
const hizmetAr=h=>(h&&(h.adAr||(window.HIZMET_AR||{})[String(h.ad||'').trim().toLocaleLowerCase('tr')]))||'';
const hizmetAdiDil=(hid,dil)=>{const h=H(hid);return dil==='ar'&&hizmetAr(h)||h.ad};

const arRakam=x=>String(x??'').replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const arTutar=n=>arRakam(Number(n||0).toLocaleString('tr-TR'))+' ₺';

function odemeMesaji(m,konu,tutar,trMetin){return MDIL(m)==='ar'?sablon(AR.odeme,{ad:ilkAd(m.ad),tutar:arTutar(tutar),hizmet:konu,firma:AYAR.firma}):trMetin}
const randevuAlanlari=(r,dil)=>{const m=M(r.mid);dil=dil||MDIL(m);const sb=seansBilgi(r);return{ad:ilkAd(m.ad),adsoyad:m.ad,gun:gunMetin(r.tarih,dil),saat:dil==='ar'?arRakam(r.saat):r.saat,hizmet:hizmetAdiDil(r.hid,dil)+(sb&&!sb.tek?(dil==='ar'?' '+AR.seans.replace('{n}',arRakam(sb.no)):' ('+sb.no+'. seans)'):''),seans:sb?sb.no+'/'+sb.toplam:'',firma:AYAR.firma,not:r.not||'',adres:m.adres||'',ucret:r.paketli?'':tl(r.ucret),kalan:dil==='ar'?arTutar(borc(r)):tl(borc(r))}};
// randevu notu → düzgün cümle (baş harf büyük, sonda nokta)
const notCumle=t=>{t=String(t||'').replace(/\s+/g,' ').trim();if(!t)return '';t=t[0].toLocaleUpperCase('tr')+t.slice(1);return /[.!?…]$/.test(t)?t:t+'.'};
// hatırlatma = şablon + randevu notu (şablonda {not} yoksa not ilk cümleden sonra eklenir)
function hatirlatMesaji(r,dil){
  dil=dil||MDIL(M(r.mid));
  const v=randevuAlanlari(r,dil),n=notCumle(v.not);
  if(dil==='ar')return sablon(AR.hatirlat,{...v,not:n});

  const m=sablon(AYAR.sablonHatirlat,v);if(!n)return m;
  const i=m.search(/(?<!\d)[.!?]\s/);return i<0?m+' '+n:m.slice(0,i+1)+' '+n+m.slice(i+1);
}

function durum(rid,d){

const SEANS_MAX=12;
const planliSeanslar=(mid,hid,haric)=>V.randevular.filter(x=>x.mid===mid&&x.hid===hid&&x.paketli&&x.durum==='bekliyor'&&x.id!==haric).sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));
function seansBilgi(r){
  if(!r.paketli)return null;
  if(r.durum==='geldi'){const p=V.paketler.find(x=>x.id===r.paketId);return p&&r.seansNo?{no:r.seansNo,toplam:p.toplam,tek:!!p.tekIslem}:null}
  if(r.durum!=='bekliyor')return null;
  const p=acikPaket(r.mid,r.hid)||V.paketler.find(x=>x.mid===r.mid&&x.hid===r.hid);if(!p)return null;
  if(p.tekIslem)return{no:1,toplam:1,tek:true};
  const i=planliSeanslar(r.mid,r.hid).findIndex(x=>x.id===r.id);
  return{no:p.kullanilan+i+1,toplam:p.toplam};
}

function yerlesim(list){
  // çakışan randevuları yan yana diz
  const out=[];let grup=[],grupSon=-1;
  const bitir=()=>{const kolonlar=[];grup.forEach(o=>{let c=kolonlar.findIndex(son=>son<=o.bas);if(c<0){c=kolonlar.length;kolonlar.push(0)}kolonlar[c]=o.son;o.kol=c});grup.forEach(o=>o.kolSay=kolonlar.length);out.push(...grup);grup=[]};
  list.filter(r=>r.durum!=='gelmedi').concat(list.filter(r=>r.durum==='gelmedi')).map(r=>({r,bas:dakika(r.saat),son:dakika(r.saat)+Math.max(15,Number(r.sure||0))})).sort((a,b)=>a.bas-b.bas).forEach(o=>{if(grup.length&&o.bas>=grupSon){bitir();grupSon=-1}grup.push(o);grupSon=Math.max(grupSon,o.son)});
  if(grup.length)bitir();return out;
}
function ekranTakvim(){

    gunler+=`<button class="gun ${t===seciliGun?'secili':''} ${t===BUGUN?'bugun':''} ${dolu?'dolu':''}" onclick="seciliGun='${t}';ciz()"><small>${KGUN[dt.getDay()]}</small><b>${dt.getDate()}</b><i></i></button>`}
  const list=gununRandevulari(seciliGun);

  let saatler='';for(let s=bas;s<son;s++)saatler+=`<div class="saatsatir" onclick="randevuFormu(null,'${seciliGun}',null,'${saatStr(s*60)}')"><span>${saatStr(s*60)}</span></div>`;
  const bloklar=yerlesim(list).map(o=>{const r=o.r,ust=(o.bas-bas*60)/60*SAAT_PX,yuk=Math.max(28,(o.son-o.bas)/60*SAAT_PX-3),gen=100/o.kolSay;

    return `<div class="blok ${r.durum}" style="top:${ust+1}px;height:${yuk}px;left:calc(${gen*o.kol}% + 4px);width:calc(${gen}% - 8px)" title="${k(M(r.mid).ad)} · ${r.saat}–${bitis(r.saat,r.sure)} · ${k(H(r.hid).ad)}" onclick="randevuDetay('${r.id}')">${ic}</div>`}).join('');
  const nd=simdiDk(),cizgi=seciliGun===BUGUN&&nd>=bas*60&&nd<son*60?`<div class="simdi" style="top:${(nd-bas*60)/60*SAAT_PX}px"></div>`:'';

    <div class="hafta"><button class="ok" onclick="seciliGun=gunEkle(seciliGun,-7);ciz()" aria-label="Önceki hafta">${I('sol')}</button>${gunler}<button class="ok" onclick="seciliGun=gunEkle(seciliGun,7);ciz()" aria-label="Sonraki hafta">${I('sag')}</button></div>
    <div class="gun-bilgi"><b>${guzelTarih(seciliGun)} · ${list.length} randevu</b><span class="not">Boş saate tıklayarak randevu ekleyin</span>${list.some(r=>r.durum==='bekliyor')&&seciliGun>=BUGUN?`<button class="btn btn-wa" style="height:32px;padding:0 10px;font-size:12.5px;flex:none" onclick="topluHatirlat('${seciliGun}')">${I('mesaj')}Hepsine hatırlat</button>`:''}</div>
    <div class="kaydir-ipucu">Günü değiştirmek için sağa-sola kaydırın · boş saate dokunarak randevu ekleyin</div>
    <div class="zaman">${saatler}${bloklar}${cizgi}</div>

/* ---------- ekran: randevusuz müşteriler — seansı bitmeyen kimse boşta kalmasın ---------- */
// ileri tarihli (bugün dahil) bekleyen randevusu olmayan müşteriler; gelmedi / işaretlenmemiş eski randevu da buraya düşer
function randevusuzlar(){
  const ileri=new Set(V.randevular.filter(r=>r.durum==='bekliyor'&&r.tarih>=BUGUN).map(r=>r.mid));
  const seansli=[],diger=[];
  V.musteriler.forEach(m=>{
    if(ileri.has(m.id))return;
    const acik=V.paketler.filter(p=>p.mid===m.id&&p.kullanilan<p.toplam);
    const son=V.randevular.filter(r=>r.mid===m.id).sort((a,b)=>(b.tarih+b.saat).localeCompare(a.tarih+a.saat))[0]||null;
    (acik.length?seansli:diger).push({m,acik,son});
  });
  const sira=(a,b)=>(a.son?a.son.tarih:'0').localeCompare(b.son?b.son.tarih:'0');
  return{seansli:seansli.sort(sira),diger:diger.sort(sira)};
}
function randevusuzSatir(o){
  const{m,acik,son}=o,p=acik[0];
  const durum=son?(son.durum==='gelmedi'?`<span class="etiket e-gelmedi">Gelmedi · ${gunAy(son.tarih)}</span>`:son.durum==='bekliyor'?`<span class="etiket e-uyari">İşaretlenmedi · ${gunAy(son.tarih)}</span>`:`<span class="etiket e-geldi">Son geliş · ${gunAy(son.tarih)}</span>`):'<span class="etiket e-bekliyor">Hiç randevu yok</span>';

    <div class="avatar">${basHarf(m.ad)}</div>

      <div class="alt-yazi">${acik.length?acik.map(x=>`${k(H(x.hid).ad)} ${x.kullanilan}/${x.toplam}`).join(' · '):k(m.tel)||'Telefon yok'}</div>
      <div class="etiketler">${durum}</div></div>
    <button class="btn btn-wa" style="width:40px" title="WhatsApp'tan randevu için yaz" ${m.tel?'':'disabled'} onclick="randevuDavet('${m.id}')">${I('mesaj')}</button>

/* ---------- ekran: tahsilat ---------- */
function tahsilatOlaylari(){
  const o=[];
  V.randevular.forEach(r=>{
    const ad=M(r.mid).ad,h=H(r.hid).ad;
    if(Number(r.kapora)>0)o.push({tarih:r.kaporaTarihi||r.tarih,tutar:Number(r.kapora),ad,mid:r.mid,aciklama:'Kapora · '+h});
    if(Number(r.alinan)>0)o.push({tarih:r.alinanTarihi||r.tarih,tutar:Number(r.alinan),ad,mid:r.mid,aciklama:'Randevuda alınan · '+h});
    if(r.durum==='geldi'&&r.odendi&&!r.paketli){const t=Number(r.ucret||0)-Number(r.kapora||0)-Number(r.alinan||0);if(t>0)o.push({tarih:r.odemeTarihi||r.tarih,tutar:t,ad,mid:r.mid,aciklama:h})}
  });
  V.paketler.forEach(p=>paketOdemeleri(p).forEach(x=>{if(Number(x.tutar)>0)o.push({tarih:x.tarih||p.tarih||'',tutar:Number(x.tutar),ad:M(p.mid).ad,mid:p.mid,aciklama:(x.not||'Ödeme')+' · '+H(p.hid).ad+(p.tekIslem?'':' ('+p.toplam+' seans)'),seans:p.tekIslem?null:(x.seans??null),hizmet:H(p.hid).ad,not:x.not||'Ödeme'})}));
  V.satislar.forEach(x=>{if(x.odendi&&Number(x.tutar)>0)o.push({tarih:x.odemeTarihi||x.tarih,tutar:Number(x.tutar),ad:satisAd(x),mid:x.mid,sid:x.id,aciklama:'Tek seferlik · '+x.aciklama})});
  return o.sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
}
function odemeHatirlat(rid){
  const r=R(rid),m=M(r.mid);
  window.open(waLink(m.tel,odemeMesaji(m,hizmetAdiDil(r.hid,'ar'),borc(r),'Merhaba '+ilkAd(m.ad)+', '+gunAy(r.tarih)+' tarihli '+H(r.hid).ad+' işleminizden kalan '+tl(borc(r))+' ödemeniz bulunmaktadır. İyi günler dileriz. '+AYAR.firma)),'_blank');

function odemeAl(rid,b){const r=R(rid),t=borc(r);if(!tahsilOnay(b,r.mid))return;r.odendi=true;r.odemeTarihi=BUGUN;kaydet();ciz();bildir(tl(t)+' tahsilat kaydedildi')}
// aynı gün aynı müşteriden ikinci tahsilat: düğmeye ikinci kez basınca kaydedilir
const bugunAlinan=mid=>mid?tahsilatOlaylari().filter(x=>x.mid===mid&&x.tarih===BUGUN).reduce((s,x)=>s+x.tutar,0):0;
function tahsilOnay(b,mid){const t=bugunAlinan(mid);if(!t||!b)return true;return ikiKez(b,'Bugün bu müşteriden '+tl(t)+' alındı. Yine de eklemek için tekrar basın')}
// "Geldi": randevuyu kapat + isteğe bağlı tahsilat

    <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--yazi);margin-top:16px;cursor:pointer"><input type="checkbox" id="gkAl" ${kalan>0&&!r.paketli?'checked':''} onchange="document.getElementById('gkTutKap').style.display=this.checked?'':'none'"> Tahsilat alındı</label>
    <div id="gkTutKap" style="${kalan>0&&!r.paketli?'':'display:none'}"><label>Alınan tutar (₺)</label><input type="number" min="1" id="gkTut" value="${kalan||''}" inputmode="numeric"><p class="ipucu">${r.paketli?'Hizmetin kalan borcundan düşülür.':'Ödenecekten az girilirse kalanı bekleyen ödemelerde görünür.'} Bugünkü tahsilata yazılır.</p></div>

function geldiKaydet(rid,b){
  const r=R(rid),al=document.getElementById('gkAl').checked,t=Math.max(0,Number(deger('gkTut')||0));
  if(al&&!t)return hata('Alınan tutarı girin.');
  if(al&&!tahsilOnay(b,r.mid))return;
  const p=r.paketli?(acikPaket(r.mid,r.hid)||V.paketler.find(x=>x.mid===r.mid&&x.hid===r.hid)):null;
  durum(rid,'geldi');
  if(al){
    if(r.paketli&&p)paketOdemeEkle(p,t,'Randevuda alınan',r.seansNo);
    else if(!r.paketli){const k=Number(r.ucret||0)-Number(r.kapora||0)-Number(r.alinan||0);if(t>=k){r.odendi=true;r.odemeTarihi=BUGUN;if(t>k){r.alinan=Number(r.alinan||0)+(t-k);r.alinanTarihi=BUGUN}}else{r.alinan=Number(r.alinan||0)+t;r.alinanTarihi=BUGUN}}
    kaydet();ciz();
  }
  kapat();bildir('Randevu kapatıldı'+(al?' · '+tl(t)+' tahsilat':''));
}
let tahsilatDonem=null;
function tahsilatSec(d){tahsilatDonem=tahsilatDonem===d?null:d;ciz();setTimeout(()=>tahsilatGit('sonTahsilat'),30)}
function tahsilatGit(id){const el=document.getElementById(id);if(!el)return;const ust=document.querySelector('.ust').offsetHeight+8;window.scrollTo({top:el.getBoundingClientRect().top+scrollY-ust,behavior:'smooth'});el.classList.remove('vurgu');void el.offsetWidth;el.classList.add('vurgu')}
function ekranTahsilat(){

    .concat(V.paketler.filter(p=>paketBorc(p)>0).map(p=>({m:M(p.mid),tarih:p.tarih||'',tutar:paketBorc(p),yazi:H(p.hid).ad+' · bedel '+tl(p.tutar)+', ödenen '+tl(paketOdenen(p)),ac:`musteriKarti('${p.mid}')`,wa:`paketOdemeHatirlat('${p.id}')`,al:`paketOdemeFormu('${p.id}')`})))
    .concat(V.satislar.filter(x=>satisBorc(x)>0).map(x=>({m:x.mid?M(x.mid):{ad:satisAd(x),tel:''},tarih:x.tarih,tutar:satisBorc(x),yazi:'Tek seferlik · '+x.aciklama+' · '+goreceli(x.tarih),ac:`satisFormu('${x.id}')`,wa:`satisHatirlat('${x.id}')`,al:`satisOdemeAl('${x.id}',this)`})))
    .sort((a,b)=>a.tarih.localeCompare(b.tarih));
  const toplamBorc=bekleyen.reduce((s,x)=>s+x.tutar,0);
  const DON={bugun:['Bugün',x=>x.tarih===BUGUN],hafta:['Bu hafta',x=>x.tarih>=pzt&&x.tarih<=BUGUN],ay:['Bu ay',x=>(x.tarih||'').startsWith(ay)]};

    <div class="panel" onclick="tahsilatGit('bekleyenOdeme')"><div class="etk">Bekleyen ödemeler<span>${I('uyari')}</span></div><b style="color:${toplamBorc?'var(--sari)':'inherit'}">${tl(toplamBorc)}</b></div>
  </div>

        <button class="btn btn-wa" style="width:40px" title="WhatsApp'tan ödeme hatırlat" ${m.tel?'':'disabled'} onclick="${x.wa}">${I('mesaj')}</button>

      </div>`}).join(''):'<div class="bos">Bekleyen ödeme yok.</div>'}</div>
    </div>
    <div class="panel" id="sonTahsilat">
      <div class="panel-ust"><h2>${I('tahsilat')}${tahsilatDonem?DON[tahsilatDonem][0]+' tahsilatlar':'Son tahsilatlar'}</h2>${tahsilatDonem?`<button class="btn btn-ikincil" style="height:32px;padding:0 12px;font-size:12.5px" onclick="tahsilatSec(null)">Tümü</button>`:`<span class="sayi">${olay.length} kayıt</span>`}</div>

/* ---------- pencere yardımcıları ---------- */
function ac(baslik,govde){document.getElementById('pencere').innerHTML=`<div class="pencere-ust"><h3>${baslik}</h3><button class="kapat" onclick="kapat()" aria-label="Kapat">${I('carpi')}</button></div><div class="pencere-ic" id="pIc">${govde}</div>`;document.getElementById('perde').classList.add('acik');document.body.classList.add('kilit');document.getElementById('pencere').scrollTop=0}
function kapat(){document.getElementById('perde').classList.remove('acik');document.body.classList.remove('kilit');if(bekleyenCiz){bekleyenCiz=false;yenidenCiz()}}

function hata(m){let e=document.getElementById('formHata');if(!e){e=document.createElement('div');e.id='formHata';e.className='uyari';document.getElementById('pIc').appendChild(e)}e.innerHTML=I('uyari')+k(m);e.scrollIntoView({behavior:'smooth',block:'nearest'});return false}
function ikiKez(b,metin){if(b.dataset.onay!=='1'){b.dataset.onay='1';b.dataset.eski=b.innerHTML;b.textContent=metin;setTimeout(()=>{if(b.isConnected&&b.dataset.onay==='1'){b.dataset.onay='';b.innerHTML=b.dataset.eski}},4000);return false}return true}
function bildir(m){let t=document.getElementById('tost');if(!t){t=document.createElement('div');t.id='tost';t.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1a1a1e;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s';document.body.appendChild(t)}t.textContent=m;t.style.opacity='1';clearTimeout(t._z);t._z=setTimeout(()=>t.style.opacity='0',2200)}

}
/* ---------- tahsilat: yalnız bekleyen borca bağlı (serbest rakam yok) ---------- */
function borcKalemleri(mid){
  const l=[];
  V.randevular.filter(r=>r.mid===mid&&borc(r)>0).forEach(r=>l.push({tur:'r',id:r.id,ad:H(r.hid).ad+' · '+kisaTarih(r.tarih)+' randevusu',kalan:borc(r),kismi:true}));
  V.paketler.filter(p=>p.mid===mid).forEach(p=>{const k=paketBorc(p)||Number(p.pesinatBekleyen||0);if(k>0)l.push({tur:'p',id:p.id,ad:H(p.hid).ad+(p.tekIslem?' (tek işlem)':' ('+p.toplam+' seans)')+(paketBorc(p)?' · kalan':' · peşinat'),kalan:k,kismi:true})});
  V.satislar.filter(x=>x.mid===mid&&satisBorc(x)>0).forEach(x=>l.push({tur:'s',id:x.id,ad:'Tek seferlik · '+x.aciklama,kalan:satisBorc(x),kismi:false}));
  return l;
}
function tahsilatFormu(mid){
  const borclu=V.musteriler.map(m=>({m,b:borcKalemleri(m.id).reduce((s,x)=>s+x.kalan,0)}));
  const sirali=borclu.filter(x=>x.b>0).sort((a,b)=>a.m.ad.localeCompare(b.m.ad,'tr')).concat(borclu.filter(x=>!x.b).sort((a,b)=>a.m.ad.localeCompare(b.m.ad,'tr')));
  ac('Tahsilat',`
    <label>Müşteri</label>
    <select id="thMus" onchange="tahsilatKalemCiz()"><option value="">Seçin</option>${sirali.map(({m,b})=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${k(m.ad)}${b?' — '+tl(b)+' bekleyen':''}</option>`).join('')}</select>
    <div id="thKalem"></div>`);
  tahsilatKalemCiz();
}
function tahsilatKalemCiz(){
  const mid=deger('thMus'),kutu=document.getElementById('thKalem');if(!kutu)return;
  if(!mid){kutu.innerHTML='<p class="ipucu" style="margin-top:10px">Bekleyen ödemesi olan müşteriler listenin başında, tutarıyla görünür.</p>';return}
  const l=borcKalemleri(mid);
  if(!l.length){kutu.innerHTML=`<div class="kutu bos" style="padding:16px;margin-top:12px">Bu müşterinin bekleyen ödemesi yok. Tahsilat, randevu ücretinden ya da müşteri kartındaki hizmet bedelinden alınır.</div>
    <button class="btn btn-ikincil btn-tam" style="margin-top:10px" onclick="musteriKarti('${mid}')">Müşteri kartını aç</button>`;return}
  kutu.innerHTML=`<label>Neyin ödemesi?</label>
    <div class="kutu">${l.map((x,i)=>`<label class="satir" style="cursor:pointer;margin:0"><span style="display:flex;align-items:center;gap:10px;color:var(--yazi)"><input type="radio" name="thSec" value="${i}" ${i?'':'checked'} onchange="tahsilatTutarAyarla()">${k(x.ad)}</span><b>${tl(x.kalan)}</b></label>`).join('')}</div>
    <label>Alınan tutar (₺)</label><input type="number" id="thTut" min="1" inputmode="numeric">
    <p class="ipucu" id="thIpucu"></p>
    <button class="btn btn-geldi btn-tam btn-buyuk" style="margin-top:14px" onclick="tahsilatKaydet(this)">${I('tamam')}Tahsil edildi</button>
    <button class="btn btn-ikincil btn-tam" style="margin-top:8px" onclick="musteriKarti('${mid}')">Müşteri kartı</button>`;
  tahsilatTutarAyarla();
}
function tahsilatSecili(){const l=borcKalemleri(deger('thMus')),i=Number(document.querySelector('input[name=thSec]:checked')?.value||0);return l[i]}
function tahsilatTutarAyarla(){
  const x=tahsilatSecili(),t=document.getElementById('thTut');if(!x||!t)return;
  t.value=x.kalan;t.max=x.kalan;t.readOnly=!x.kismi;
  document.getElementById('thIpucu').textContent=x.kismi?'En fazla '+tl(x.kalan)+'. Daha az girilirse kalanı bekleyen ödemelerde kalır. Bugünkü tahsilata yazılır.':'Bu işlem tek seferde tahsil edilir: '+tl(x.kalan)+'. Bugünkü tahsilata yazılır.';
}
function tahsilatKaydet(b){
  const mid=deger('thMus'),x=tahsilatSecili(),t=Math.round(Number(deger('thTut')||0)*100)/100;
  if(!x)return hata('Ödeme kalemi seçin.');
  if(!(t>0))return hata('Tutar 0 olamaz.');
  if(t>x.kalan)return hata('Tutar kalan borçtan ('+tl(x.kalan)+') fazla olamaz.');
  if(!x.kismi&&t!==x.kalan)return hata('Bu işlem yalnız tam tutarla ('+tl(x.kalan)+') tahsil edilir.');
  if(!tahsilOnay(b,mid))return;
  if(x.tur==='r'){const r=R(x.id);if(t>=borc(r)){r.odendi=true;r.odemeTarihi=BUGUN}else{r.alinan=Number(r.alinan||0)+t;r.alinanTarihi=BUGUN}}
  else if(x.tur==='p'){const p=V.paketler.find(y=>y.id===x.id),pes=p.pesinatBekleyen&&t>=p.pesinatBekleyen;paketOdemeEkle(p,t,pes?'Peşinat':'Ödeme');if(pes)delete p.pesinatBekleyen}
  else{const s_=S_(x.id);s_.odendi=true;s_.odemeTarihi=BUGUN}
  kaydet();ciz();kapat();bildir(M(mid).ad+': '+tl(t)+' tahsil edildi');
}

function satisFormu(sid,mid){
  const x=sid?S_(sid):{mid:mid||'',aciklama:'',tutar:'',tarih:BUGUN,odendi:true,not:''};

    <div id="sYeniMus" style="display:none" class="iki"><div><label>Ad Soyad</label><input id="sYAd" autocomplete="off"></div><div><label>Telefon</label><input id="sYTel" inputmode="tel" oninput="this.value=telBicim(this.value)" placeholder="05xx xxx xxxx" autocomplete="off"></div></div>

    <div class="iki"><div><label>Tutar (₺)</label><input type="number" min="0" id="sTut" value="${x.tutar===''?'':x.tutar}" inputmode="numeric"></div><div><label>Tarih</label><input type="date" id="sTar" value="${x.tarih}"></div></div>

  document.getElementById('sMus').onchange=()=>{const y=deger('sMus')==='__yeni';document.getElementById('sYeniMus').style.display=y?'grid':'none';if(y)document.getElementById('sYAd').focus()};

function satisKaydet(sid){
  let mid=deger('sMus');const aciklama=deger('sAc');
  if(!aciklama)return hata('Ne satıldığını yazın.');
  if(mid==='__yeni'){const ad=deger('sYAd');if(!ad)return hata('Yeni müşterinin adını yazın.');mid=yeniId();V.musteriler.push({id:mid,ad,tel:deger('sYTel'),eposta:'',dogum:'',adres:'',ek:'',uyari:'',kaynak:'',not:''})}
  const odendi=deger('sOde')==='1',onceki=sid?S_(sid):null;
  const v={mid,aciklama,tutar:Math.max(0,Number(deger('sTut')||0)),tarih:deger('sTar')||BUGUN,odendi,not:deger('sNot')};
  v.odemeTarihi=odendi?((onceki&&onceki.odendi&&onceki.odemeTarihi)||(onceki?BUGUN:v.tarih)):null;
  if(sid)Object.assign(onceki,v);else V.satislar.push({id:yeniId(),...v});

    <div class="iki"><div><label>Süre (dk)</label><input type="number" min="5" step="5" id="fSure" value="${r.sure}" inputmode="numeric"></div><div><label>Ücret (₺)</label><input type="number" min="0" id="fUcr" value="${r.ucret===''?'':r.ucret}" inputmode="numeric"></div></div>

    ${rid?'':`<div class="iki"><div><label>Randevu sayısı</label><select id="fAdet">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1} randevu</option>`).join('')}</select></div>
      <div id="fAralikKap" style="visibility:hidden"><label>Aralık</label><select id="fAralik"><option value="7">Her hafta</option><option value="14">2 haftada bir</option><option value="21">3 haftada bir</option><option value="28">4 haftada bir</option><option value="30">Her ay (30 gün)</option></select></div></div>
    <div id="tekrarListe"></div>`}

    <button class="btn btn-ana btn-tam btn-buyuk" style="margin-top:18px" onclick="randevuKaydet('${rid||''}')">Kaydet</button>`);
  let paketVar=false;

    document.getElementById('fUcr').disabled=paketVar;if(paketVar)document.getElementById('fUcr').value=0;
    const t=deger('fTar'),s=deger('fSaat'),su=Number(deger('fSure')||0),bs=s?dakika(s):0;

          return `<div class="satir"><span>${i+1}. ${guzelTarih(tt)} · ${s}</span><b>${sy}${cc?` <span class="etiket e-uyari">Dolu: ${k(M(cc.mid).ad)}</span>`:''}</b></div>`}).join('')}</div>

  document.getElementById('fHiz').onchange=()=>{

    else{const h=H(deger('fHiz'));if(h.sure)document.getElementById('fSure').value=h.sure;document.getElementById('fUcr').value=h.fiyat||''}
    kontrol()};
  document.getElementById('fMus').onchange=()=>{kontrol();if(deger('fMus')==='__yeni')document.getElementById('fYAd').focus()};
  ['fTar','fSaat','fSure'].forEach(i=>document.getElementById(i).addEventListener('input',kontrol));
  ['fAdet','fAralik'].forEach(i=>{const e=document.getElementById(i);if(e)e.addEventListener('change',kontrol)});
  if(!rid&&r.hid)document.getElementById('fHiz').onchange();else kontrol();
}
function randevuKaydet(rid){
  let mid=deger('fMus');const paketli=document.getElementById('fMus').dataset.paket==='1';
  if(!mid)return hata('Müşteri seçin.');
  if(!deger('fHiz'))return hata('Hizmet seçin.');
  if(!deger('fTar')||!deger('fSaat'))return hata('Tarih ve saat girin.');
  let hid=deger('fHiz');
  if(hid==='__yeni'&&!deger('fYHAd'))return hata('Yeni hizmetin adını yazın.');
  if(mid==='__yeni'){const ad=deger('fYAd');if(!ad)return hata('Yeni müşterinin adını yazın.');mid=yeniId();V.musteriler.push({id:mid,ad,tel:deger('fYTel'),eposta:'',dogum:'',adres:'',ek:'',uyari:'',kaynak:'',not:''})}
  if(hid==='__yeni'){const ad=deger('fYHAd'),var_=V.hizmetler.find(h=>h.ad.toLocaleLowerCase('tr')===ad.toLocaleLowerCase('tr'));if(var_)hid=var_.id;else{hid=yeniId();const u=deger('fUcr');V.hizmetler.push({id:hid,ad,fiyat:paketli||u===''?'':Math.max(0,Number(u)||0)})}}
  const veri={mid,hid,tarih:deger('fTar'),saat:deger('fSaat'),sure:Math.max(5,Number(deger('fSure')||H(hid).sure||30)),ucret:paketli?0:Number(deger('fUcr')||0),kapora:Number(deger('fKap')||0),not:deger('fNot'),paketli};
  veri.kaporaTarihi=veri.kapora?((rid&&R(rid).kaporaTarihi)||BUGUN):null;
  const adet=rid?1:Math.min(12,Math.max(1,Number(deger('fAdet')||1))),aralik=Number(deger('fAralik')||7),bos=Number(document.getElementById('fMus').dataset.bos||0);
  if(rid)Object.assign(R(rid),veri);
  else for(let i=0;i<adet;i++){
    const pk=paketli&&(adet===1||i<bos),fiyat=paketli?(H(hid).fiyat||0):Number(deger('fUcr')||0);
    V.randevular.push({id:yeniId(),durum:'bekliyor',odendi:false,...veri,tarih:gunEkle(veri.tarih,i*aralik),paketli:pk,ucret:pk?0:fiyat,kapora:i?0:veri.kapora,kaporaTarihi:i?null:veri.kaporaTarihi});
  }
  kaydet();kapat();if(ekran==='takvim')seciliGun=veri.tarih;ciz();bildir(rid?'Randevu güncellendi':adet>1?adet+' randevu eklendi':'Randevu eklendi');
}

// randevu kartında tahsilat: bu randevunun / hizmetin ödeme durumu + tahsilat düğmesi
function randevuTahsilatKutusu(r){
  const m=M(r.mid),p=r.paketli?(V.paketler.find(x=>x.id===r.paketId)||acikPaket(r.mid,r.hid)||V.paketler.find(x=>x.mid===r.mid&&x.hid===r.hid)):null;
  const satir=(a,b)=>`<div class="satir"><span>${a}</span><b>${b}</b></div>`;
  let ic='';
  if(p){ic+=Number(p.tutar)>0?satir('Hizmet bedeli',tl(p.tutar)):'';ic+=satir('Hizmette ödenen',tl(paketOdenen(p)));if(Number(p.tutar)>0)ic+=satir('Hizmet kalanı',paketBorc(p)?`<span class="etiket e-borc">${tl(paketBorc(p))}</span>`:'<span class="etiket e-odendi">Ödeme tamam</span>')}
  else{const alinan=Number(r.kapora||0)+Number(r.alinan||0)+(r.odendi?Math.max(0,Number(r.ucret||0)-Number(r.kapora||0)-Number(r.alinan||0)):0);
    ic+=satir('Alınan',tl(alinan));ic+=satir('Kalan',r.durum!=='geldi'?(Number(r.ucret||0)-alinan>0?tl(Number(r.ucret||0)-alinan)+' (randevu kapanınca)':'—'):borc(r)?`<span class="etiket e-borc">${tl(borc(r))}</span>`:'<span class="etiket e-odendi">Ödendi</span>')}

    :mb>0?`<button class="btn btn-geldi btn-tam" style="margin-top:8px" onclick="tahsilatFormu('${m.id}')">${I('para')}Tahsilat al (${tl(mb)} bekleyen)</button>`:'';
  return `<div class="bolum">Tahsilat</div><div class="kutu">${ic}</div>${dug}`;
}
// randevu kartında: müşteri tekrar geldiğinde daha önce aldığı hizmetler bir bakışta
function musteriGecmisOzet(mid,haricRid){
  const p=V.paketler.filter(x=>x.mid===mid).map(x=>`<div class="satir"><span>${k(H(x.hid).ad)}</span><b>${x.tekIslem?(x.kullanilan?'Yapıldı':'Tek işlem'):x.kullanilan+'/'+x.toplam+' seans'}${x.kullanilan>=x.toplam?' <span class="etiket e-odendi">Tamamlandı</span>':''}</b></div>`);
  const g=V.randevular.filter(x=>x.mid===mid&&x.id!==haricRid&&x.durum==='geldi').sort((a,b)=>(b.tarih+b.saat).localeCompare(a.tarih+a.saat)).slice(0,5)
    .map(x=>`<div class="satir" style="cursor:pointer" onclick="randevuDetay('${x.id}')"><span>${kisaTarih(x.tarih)}</span><b>${k(H(x.hid).ad)}${x.seansNo?' · '+x.seansNo+'. seans':''}</b></div>`);
  const s=V.satislar.filter(x=>x.mid===mid).sort((a,b)=>b.tarih.localeCompare(a.tarih)).slice(0,3).map(x=>`<div class="satir"><span>${kisaTarih(x.tarih)}</span><b>${k(x.aciklama)}</b></div>`);

function odemeDegis(rid,b){const r=R(rid);if(!r.odendi&&!tahsilOnay(b,r.mid))return;r.odendi=!r.odendi;if(r.odendi)r.odemeTarihi=BUGUN;else delete r.odemeTarihi;kaydet();ciz();randevuDetay(rid)}
function durumGeriAl(rid){const r=R(rid);if(r.paketId){const p=V.paketler.find(x=>x.id===r.paketId);if(p&&p.kullanilan>0)p.kullanilan--;delete r.paketId;delete r.seansNo}delete r.gelmediSeans;r.durum='bekliyor';r.odendi=false;delete r.odemeTarihi;kaydet();ciz();randevuDetay(rid)}
function randevuSil(rid){const r=R(rid);if(r.paketId&&r.durum==='geldi'){const p=V.paketler.find(x=>x.id===r.paketId);if(p&&p.kullanilan>0)p.kullanilan--}V.randevular=V.randevular.filter(x=>x.id!==rid);kaydet();kapat();ciz();bildir('Randevu silindi')}

const TUR_AD={musteri:'Müşteri',hizmet:'Hizmet',randevu:'Randevu',paket:'Paket',gorev:'Hatırlatıcı',satis:'Tek seferlik işlem',firma:'Firma'};
const ALAN_AD={ad:'ad',tel:'telefon',eposta:'e-posta',dogum:'doğum günü',adres:'adres',ek:'ek bilgi',uyari:'uyarı notu',kaynak:'nereden geldi',not:'not',tarih:'tarih',saat:'saat',sure:'süre',ucret:'ücret',kapora:'kapora',odendi:'ödeme',durum:'durum',hatirlatildi:'WhatsApp hatırlatma',paketli:'paket',paketId:'paket',mid:'müşteri',hid:'hizmet',fiyat:'fiyat',toplam:'toplam seans',kullanilan:'kullanılan seans',odenen:'ödenen',baslik:'başlık',bitti:'tamamlandı',firma:'firma adı',sektor:'sektör',renk:'renk',sablonHatirlat:'hatırlatma mesajı',sablonDogum:'doğum günü mesajı',kuruldu:'ilk kurulum',hizmetAdi:'hizmet adı',seansNo:'seans no',gelmediSeans:'gelmediği seans',adAr:'Arapça adı',dil:'mesaj dili',dogumKampanya:'doğum günü indirimi',sablonDogumIndirim:'indirimli doğum günü mesajı',dogumIndirim:'doğum günü indirimi',dogumGecerlilik:'indirim geçerliliği',alinan:'randevuda alınan',alinanTarihi:'alınma tarihi',odemeler:'ödemeler',pesinatBekleyen:'bekleyen peşinat',tekIslem:'tek işlem',sira:'sıra',aciklama:'açıklama',tutar:'tutar',odemeTarihi:'ödeme tarihi',kaporaTarihi:'kapora tarihi',bildirimDk:'randevu bildirimi',sabahOzet:'sabah özeti',sabahSaat:'sabah özeti saati'};
function logDeger(a,v){
  if(v===undefined||v===null||v==='')return '—';
  if(a==='durum')return DURUM[v]||v;
  if(['odendi','bitti','hatirlatildi','paketli'].includes(a))return v?'evet':'hayır';
  if(['ucret','kapora','fiyat','odenen','tutar','alinan'].includes(a))return tl(v);
  if(a==='sabahOzet')return v?'açık':'kapalı'; if(a==='dil')return v==='ar'?'Arapça':'Türkçe'; if(a==='odemeler')return Array.isArray(v)?v.length+' ödeme ('+tl(v.reduce((s,x)=>s+Number(x.tutar||0),0))+')':'—'; if(a==='bildirimDk')return Number(v)?v+' dk önce':'kapalı';
  if(a==='mid')return M(v).ad; if(a==='hid')return H(v).ad;
  if(a==='sektor')return (SEKTORLER[v]||{}).ad||v;
  if(a==='renk')return (RENKLER[v]||{}).ad||v;
  if((a==='tarih'||a==='dogum')&&/^\d{4}-\d\d-\d\d$/.test(v))return kisaTarih(v);
  if(a==='sure')return v+' dk';
  const s=String(v);return s.length>40?s.slice(0,40)+'…':s;
}
function logCumle(l){
  if(l.islem==='giris')return 'Uygulamayı açtı';
  if(l.islem==='goruntuledi')return l.tur==='musteri'?'Müşteri kartını açtı: '+(l.ozet||''):'Sayfayı açtı: '+(l.ozet||'');
  if(l.islem==='yonetim')return 'Yönetim: '+(l.ozet||'');
  if(l.islem==='ayar')return 'Ayarları değiştirdi'+(l.degisen?' ('+l.degisen.split(',').map(a=>ALAN_AD[a]||a).join(', ')+')':'');
  let s=(TUR_AD[l.tur]||l.tur)+' '+({ekledi:'eklendi',guncelledi:'güncellendi',sildi:'silindi'}[l.islem]||l.islem)+(l.ozet?': '+l.ozet:'');
  if(l.islem==='guncelledi'&&l.degisen){
    const d=l.degisen.split(',');
    s+=' · '+d.slice(0,3).map(a=>(ALAN_AD[a]||a)+(l.onceki&&l.sonraki?': '+logDeger(a,l.onceki[a])+' → '+logDeger(a,l.sonraki[a]):'')).join(' · ')+(d.length>3?' · +'+(d.length-3)+' alan':'');
  }
  return s;
}

}

function paketKaydet(mid,randevuVer){

  if(!l.length)return hata('En az bir hizmet seçin.');
  paketleriEkle(mid,l);kaydet();ciz();
  if(randevuVer)randevuFormu(null,null,mid,null,l[0].hid);else musteriKarti(mid);
  bildir(l.length+' hizmet eklendi');
}

  const g=gid?V.gorevler.find(x=>x.id===gid):{baslik:'',mid:mid||'',tarih:BUGUN,saat:'',bitti:false};
  ac(gid?'Hatırlatıcıyı düzenle':'Yeni hatırlatıcı',`
    <label>Ne yapılacak? *</label><input id="gBas" value="${k(g.baslik)}" placeholder="Örn. Geri ara, teklif gönder, ödeme hatırlat" autocomplete="off">
    <label>İlgili müşteri</label><select id="gMus"><option value="">Genel (müşteriye bağlı değil)</option>${V.musteriler.slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr')).map(m=>`<option value="${m.id}" ${m.id===g.mid?'selected':''}>${k(m.ad)}</option>`).join('')}</select>
    <div class="iki"><div><label>Tarih</label><input type="date" id="gTar" value="${g.tarih}"></div><div><label>Saat (isteğe bağlı)</label><input type="time" id="gSaat" value="${g.saat}"></div></div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${[['Bugün',0],['Yarın',1],['3 gün sonra',3],['1 hafta sonra',7]].map(x=>`<button class="btn btn-ikincil" style="height:32px;font-size:12.5px;padding:0 12px" onclick="document.getElementById('gTar').value='${gunEkle(BUGUN,x[1])}'">${x[0]}</button>`).join('')}</div>
    <button class="btn btn-ana btn-tam btn-buyuk" style="margin-top:18px" onclick="gorevKaydet('${gid||''}')">Kaydet</button>
    ${gid?`<button class="btn btn-sil btn-tam" style="margin-top:8px" onclick="if(ikiKez(this,'Silmek için tekrar basın'))gorevSil('${gid}')">Sil</button>`:''}`);
  if(!gid)setTimeout(()=>document.getElementById('gBas')?.focus(),50);
}
function gorevKaydet(gid){
  const v={baslik:deger('gBas'),mid:deger('gMus'),tarih:deger('gTar')||BUGUN,saat:deger('gSaat')};
  if(!v.baslik)return hata('Ne yapılacağını yazın.');
  if(gid)Object.assign(V.gorevler.find(x=>x.id===gid),v);else V.gorevler.push({id:yeniId(),bitti:false,...v});
  kaydet();kapat();ciz();bildir('Hatırlatıcı kaydedildi');
}
function gorevSil(gid){V.gorevler=V.gorevler.filter(x=>x.id!==gid);kaydet();kapat();ciz()}

  const h=hid?V.hizmetler.find(x=>x.id===hid):{ad:'',fiyat:''};
  ac(hid?'Hizmeti düzenle':'Yeni hizmet',`
    <label>Hizmet adı *</label><input id="hAd" value="${k(h.ad)}" autocomplete="off">
    <label>Arapça adı <span style="font-weight:400">· isteğe bağlı</span></label><input id="hAdAr" dir="rtl" value="${k(h.adAr||'')}" placeholder="${k((window.HIZMET_AR||{})[String(h.ad||'').trim().toLocaleLowerCase('tr')]||'Arapça mesajlarda kullanılır')}" autocomplete="off">
    <p class="ipucu">Arapça mesaj giden müşterilere hizmet bu adla yazılır. Boş bırakılırsa hazır listede varsa o (soluk yazılı olan), yoksa Türkçe ad kullanılır.</p>
    <label>Fiyat (₺) <span style="font-weight:400">· isteğe bağlı</span></label><input type="number" min="0" id="hFiy" value="${h.fiyat||''}" inputmode="numeric" placeholder="Boş bırakabilirsiniz">
